[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-matrix-orchestrator"
version = "0.1.0"
description = "Local thesis experiment matrix readiness orchestrator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
experiment-matrix-orchestrator = "experiment_matrix_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
